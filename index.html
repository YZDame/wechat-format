<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WeChat Format</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="codemirror/codemirror.css">
  <link rel="stylesheet" href="assets/css/app.css?v=3">
  <script defer src="assets/scripts/marked.min.js"></script>
  <script defer src="assets/scripts/FuriganaMD.js"></script>
  <script defer src="codemirror/codemirror.js"></script>
  <script defer src="codemirror/mode/markdown/markdown.js"></script>
  <script defer src="assets/scripts/themes/yanqi.js?v=2"></script>
  <script defer src="assets/scripts/renderers/wx-renderer.js?v=3"></script>
  <script defer src="assets/scripts/editor.js?v=3"></script>
</head>
<body>
  <header class="toolbar">
    <h1>WeChat Format</h1>
    <div class="toolbar-actions">
      <button id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1a9 9 0 1 0 10.2 10.2Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button id="copy" type="button" aria-label="复制排版结果" title="复制排版结果">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 4H6a2 2 0 0 0-2 2v10"/></svg>
      </button>
    </div>
  </header>
  <main class="workspace">
    <section class="editor-pane" id="editor-pane" aria-label="Markdown 编辑器">
      <textarea id="editor" aria-label="Markdown 正文"></textarea>
    </section>
    <div id="splitter" role="separator" aria-label="调整编辑器宽度" aria-controls="editor-pane" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="62" tabindex="0"></div>
    <section class="preview-pane" aria-label="文章预览">
      <div id="output" class="preview"></div>
    </section>
  </main>
  <div id="status" role="status"></div>
</body>
</html>
